[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dispatch"
version = "0.1.0"
description = "RSS feed reader and aggregator built with Flask"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Dispatch Team" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content :: News/Diary",
]
requires-python = ">=3.10"
dependencies = [
    "feedparser==6.0.10",
    "opml==0.5",
    "requests==2.31.0",
    "beautifulsoup4==4.12.2",
    "SQLAlchemy==2.0.23",
    "python-dateutil==2.8.2",
    "flask==3.0.3",
    "gunicorn==22.0.0",
    "Flask-Executor==1.0.0",
    "readabilipy==0.2.0",
    "python-multipart==0.0.9",
    "APScheduler==3.10.4",
    "lxml>=4.9.0",
]

[project.optional-dependencies]
dev = [
    # Testing framework and utilities
    "pytest>=7.4.3",
    "pytest-flask>=1.3.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "pytest-watch>=4.2.0",
    # Property-based testing
    "hypothesis>=6.90.0",
    # Test data and mocking
    "factory-boy>=3.3.0",
    "responses>=0.24.1",
    # Code quality and formatting
    "ruff>=0.1.6",
]

[project.urls]
Homepage = "https://github.com/yourusername/dispatch"
Repository = "https://github.com/yourusername/dispatch.git"
Issues = "https://github.com/yourusername/dispatch/issues"

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.3",
    "pytest-flask>=1.3.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "pytest-watch>=4.2.0",
    "hypothesis>=6.90.0",
    "factory-boy>=3.3.0",
    "responses>=0.24.1",
    "ruff>=0.1.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
    "--cov=dispatch",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
]
markers = [
    "unit: Unit tests for pure logic functions",
    "integration: Integration tests that touch database or external APIs",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.hatch.build.targets.wheel]
packages = ["dispatch"]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    ".pytest_cache",
    "htmlcov",
]

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.12
target-version = "py312"

[tool.ruff.lint]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
select = ["E", "F", "W", "I", "UP", "B", "C4", "PGH", "RUF"]

ignore = [
    # Ignore star imports - they're used intentionally in this codebase
    "F403", # 'from module import *' used; unable to detect undefined names
    "F405", # name may be undefined, or defined from star imports
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# Allow bare except in migration files where it's used intentionally
# Also allow module level imports not at top in migration files
"dispatch/migrations/*.py" = ["E722", "E402"]
# Allow bare except in scheduler service for error handling
"dispatch/services/scheduler_service.py" = ["E722"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.coverage.run]
source = ["dispatch"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstract",
]
