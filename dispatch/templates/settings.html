{% extends "base.html" %} {% block content %}

<div class="settings_container">
    <div class="settings_item">
        <h1>Settings</h1>
    </div>

    <div class="settings_item">
        <form
            id="theme_form"
            hx-post="/set_default_theme"
            hx-target="#root_style"
            hx-swap="outerHTML"
        >
            <label for="theme">Select a theme:</label>
            <select id="theme" name="theme">
                <option
                    hx-post="/set_theme"
                    hx-target="#root_style"
                    hx-swap="outerHTML"
                    value="light"
                >
                    Light
                </option>
                <option
                    hx-post="/set_theme"
                    hx-target="#root_style"
                    hx-swap="outerHTML"
                    value="dark"
                >
                    Dark
                </option>
                <option
                    hx-post="/set_theme"
                    hx-target="#root_style"
                    hx-swap="outerHTML"
                    value="clean"
                >
                    Clean
                </option>
                <option
                    hx-post="/set_theme"
                    hx-target="#root_style"
                    hx-swap="outerHTML"
                    value="new"
                >
                    New
                </option>
            </select>
            <button type="submit">Set Default</button>
        </form>
    </div>

    <div class="settings_item">
        <form
            id="add_feed_form"
            hx-post="/add_feed"
            hx-params="*"
            hx-target="#add_feed_result"
            hx-swap="innerHTML"
        >
            <h3>Add feed</h3>
            <input
                type="text"
                id="feed_url"
                name="feed_url"
                placeholder="https://example.com/feed.xml"
                required
            />
            <button type="submit">Add Feed</button>
        </form>
        <div id="add_feed_result"></div>
    </div>

    <div class="settings_item">
        <form
            hx-post="/upload_opml"
            enctype="multipart/form-data"
            hx-target="#opml_upload_result"
            hx-swap="innerHTML"
        >
            <h3>Import from OPML</h3>
            <div>
                <input type="file" name="opml_file" accept=".opml" />
                <input type="submit" value="Submit" />
            </div>
        </form>
        <div id="opml_upload_result"></div>
    </div>

    <div class="settings_item">
        <h3>Refresh Feed Information</h3>
        <p>Re-fetch favicons and feed information for all feeds.</p>
        <button
            type="button"
            class="refresh_button"
            id="refresh_favicons_btn"
            hx-post="/refresh_favicons"
            hx-target="#refresh_result"
            hx-swap="innerHTML"
            hx-indicator="#refresh_loading"
        >
            Refresh All Feed Favicons
        </button>
        <div id="refresh_loading" class="htmx-indicator">
            <p>🔄 Refreshing favicons...</p>
        </div>
        <div id="refresh_result"></div>
    </div>

    <div class="settings_item">
        {% include 'settings-feed-table-partial.html' %}
    </div>
</div>

{% endblock %}
